<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="src/styles/fonts/font.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
    <div class="games">
        <span class="title">All games:</span>
        <div class="game_list"></div>
    </div>

    <div class="game_zone">
        <div class="opponent_info"></div>

        <div class="deck_info">
            <span class="countCards"></span>
            <img class="deck_img" src="./src/assets/logotip/logo.png" alt="Deck"/>
            <span class="step"></span>
        </div>

        <div class="container_for_user_deck"></div>

        <div class="exit_button">
            <button class="exit_btn">Exit</button>
        </div>
    </div>
    <button class="create_game">Create New Game</button>
</main>

<div class="players_select">
    <span>How many players?</span>
    <div class="select_container">
        <span class="option" data-players="2">2</span>
        <span class="option" data-players="3">3</span>
        <span class="option" data-players="4">4</span>
    </div>
</div>

<script type="module" src="./script.js"></script>
<script type="module" src="./src/scripts/style_and_animation.js"></script>
</body>
</html>
